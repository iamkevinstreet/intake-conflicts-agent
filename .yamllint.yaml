#  Purpose:           yamllint rules: the defaults, a 99-column        #
#                     margin, and GitHub's unquoted "on" key allowed.  #
########################################################################
extends: default
rules:
  line-length:
    max: 99
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
