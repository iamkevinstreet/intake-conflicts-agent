########################################################################
#                                                                      #
#                        backend/pyproject.toml                        #
#                                                                      #
########################################################################
# Author:            Kevin Street
# Created on:        2026-10-29
# Last modified on:  2026-11-03
#
# Packages the intake service and sets ruff, mypy and pytest to the code
# standard.

[project]
name = "intake-conflicts-agent"
version = "0.2.0"
description = "New-matter intake agent with scoped tools and an approval gate it cannot pass."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kevin Street", email = "info@kevindstreet.com" }]
dependencies = [
  "kds-args>=0.5.0,<0.6",
  "kds-settings>=0.5.0,<0.6",
  "kds-logs>=0.5.0,<0.6",
  "kds-llm>=0.5.0,<0.6",
  "kds-evals>=0.5.0,<0.6",
  "kds-synthetic>=0.5.0,<0.6",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "rapidfuzz>=3.9",
  "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
# The evaluation dashboard and the figures and CSV files the case study and Tableau read.
dashboard = ["dash>=3", "plotly>=6", "pandas>=2.2"]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.13",
  "pandas-stubs>=2.2",
  "pip-audit>=2.7",
  "pytest>=8.3",
  "ruff==0.17.3",
  "kds-standards>=0.5.0,<0.6",
  "kds-diagrams>=0.5.0,<0.6",
]

# Our own packages come from the utils repository at one reviewed commit; none
# of them is on PyPI, so a same-named public package can never be installed.
[tool.uv.sources]
kds-args = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "args", rev = "fcac0477e1caadccf1e2d7580ce648258c5a79fa" }
kds-settings = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "settings", rev = "fcac0477e1caadccf1e2d7580ce648258c5a79fa" }
kds-logs = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "logs", rev = "fcac0477e1caadccf1e2d7580ce648258c5a79fa" }
kds-llm = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "llm", rev = "fcac0477e1caadccf1e2d7580ce648258c5a79fa" }
kds-evals = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "evals", rev = "fcac0477e1caadccf1e2d7580ce648258c5a79fa" }
kds-synthetic = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "synthetic", rev = "fcac0477e1caadccf1e2d7580ce648258c5a79fa" }
kds-standards = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "standards", rev = "fcac0477e1caadccf1e2d7580ce648258c5a79fa" }
kds-diagrams = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "diagrams", rev = "fcac0477e1caadccf1e2d7580ce648258c5a79fa" }

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["intake_agent*"]

[tool.ruff]
line-length = 99
target-version = "py312"
# The package lives in src/ and the tests import their own helpers, so isort reads both as
# first-party code.
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "BLE", "S", "C90", "PL", "RUF", "G", "D", "ANN"]
# A module's doc block opens with its fields (Author and the dates), not a summary, so the
# summary-first docstring rules do not fit it; kds-standards checks every function's doc block.
ignore = ["D205", "D212", "D415", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 5

[tool.ruff.lint.isort]
known-first-party = ["intake_agent"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, repeat expected values inline, and hold made-up tokens.
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Dash registers a pytest plugin for browser tests we do not use; its old-style hooks warn.
addopts = "-q -p no:dash"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*", "dash", "dash.*"]
ignore_missing_imports = true
