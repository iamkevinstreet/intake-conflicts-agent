[project]
name = "intake-conflicts-agent"
version = "0.1.0"
description = "New-matter intake agent with scoped tools and server-side approval gates."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kevin Street", email = "info@kevindstreet.com" }]
dependencies = [
  "kds-settings @ git+https://github.com/iamkevinstreet/utils.git@main#subdirectory=settings",
  "kds-logs @ git+https://github.com/iamkevinstreet/utils.git@main#subdirectory=logs",
  "kds-llm @ git+https://github.com/iamkevinstreet/utils.git@main#subdirectory=llm",
  "kds-evals @ git+https://github.com/iamkevinstreet/utils.git@main#subdirectory=evals",
  "kds-synthetic @ git+https://github.com/iamkevinstreet/utils.git@main#subdirectory=synthetic",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "rapidfuzz>=3.9",
  "httpx>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "pre-commit>=3.8"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["intake_agent*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection uses call expressions as defaults by design.
"intake_agent/api.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["intake_agent"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
