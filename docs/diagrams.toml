]

[[diagram]]
file = "flow.svg"
width = 1000
height = 560
title = "How an intake runs"
subtitle = "Every step is checked by the service, so a model that misbehaves still cannot open a matter."
caption = "Steps in reading order. Blue: the requests that leave your machine."

[[diagram.component]]
box = [28, 160, 272, 80]
name = "1. Check the email"
details = ["20 to 20,000 characters", "a limit per person; orders flagged"]

[[diagram.component]]
box = [364, 160, 272, 80]
name = "2. Read and search"
details = ["the model names every party", "two searches, both read only"]

[[diagram.component]]
box = [700, 160, 272, 80]
name = "3. Draft the matter"
details = ["refused until all are searched", "findings come from the searches"]

[[diagram.component]]
box = [28, 300, 272, 80]
name = "4. Ask for approval"
details = ["only this run's own draft", "the agent's work ends here"]

[[diagram.component]]
box = [364, 300, 272, 80]
name = "5. A person decides"
details = ["an approver, not the requester", "a reason to approve past a flag"]

[[diagram.component]]
box = [700, 300, 272, 80]
name = "6. Open the matter"
details = ["only with an approval record", "the agent is always refused"]

