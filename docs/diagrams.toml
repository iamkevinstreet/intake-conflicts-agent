# Boxes are [left, top, width, height] in pixels; arrow points are [x, y].

[[diagram]]
file = "architecture.svg"
width = 1000
height = 800
title = "The intake agent at a glance"
subtitle = "The agent can search and draft. Only a person can approve, and only an approval opens a matter."
caption = "Grey arrows: what moves between parts. Blue: the one path that leaves your machine. Dashed boxes: where each part runs and who may act there."

[[diagram.zone]]
box = [28, 150, 420, 132]
title = "Browser"
rule = "requesters and approvers"

[[diagram.component]]
box = [48, 190, 380, 76]
name = "Web app"
details = ["React and TypeScript: intake, approvals, audit", "acts as a made-up person on localhost"]
note = "Entra sign-in to build"

[[diagram.component]]
box = [612, 170, 360, 80]
name = "Model provider"
details = ["outside your machine: Anthropic by default", "sees the rules, the fenced email, results"]

[[diagram.zone]]
box = [28, 320, 944, 168]
title = "Service"
rule = "your machine, localhost by default"

[[diagram.component]]
box = [48, 360, 208, 108]
name = "API"
details = ["FastAPI, /api/v1", "Entra ID or dev roles", "limits, hosts, headers"]

[[diagram.component]]
box = [280, 360, 208, 108]
name = "Agent loop"
details = ["steps, calls, $ capped", "requester role only", "stand-in when offline"]

[[diagram.component]]
box = [512, 360, 208, 108]
name = "Toolbox"
details = ["five tools, args checked", "drafts need searches", "findings from searches"]

[[diagram.component]]
box = [744, 360, 208, 108]
name = "Drafts and gate"
details = ["approval: four eyes", "open: approval needed", "checked again in SQL"]

