<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc"><title id="title">The intake agent at a glance</title><desc id="desc">The agent can search and draft. Only a person can approve, and only an approval opens a matter.</desc><defs><marker id="plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a3a3a3"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b8def"/></marker></defs><rect width="100%" height="100%" fill="#121212"/><text x="28" y="64" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" fill="#f2f2f2" font-size="44">The intake agent at a glance</text><text x="28" y="100" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="16" font-weight="700">The agent can search and draft. Only a person can approve, and only an approval opens a matter.</text><text x="28" y="122" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">Grey arrows: what moves between parts. Blue: the one path that leaves your machine. Dashed boxes: where each part runs and who may act there.</text><rect x="28" y="150" width="420" height="132" rx="8" fill="none" stroke="#4a4a4a" stroke-width="1" stroke-dasharray="5 4"/><text x="42" y="174" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Browser · requesters and approvers</text><rect x="28" y="320" width="944" height="168" rx="8" fill="none" stroke="#4a4a4a" stroke-width="1" stroke-dasharray="5 4"/><text x="42" y="344" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Service · your machine, localhost by default</text><rect x="512" y="520" width="460" height="130" rx="8" fill="none" stroke="#4a4a4a" stroke-width="1" stroke-dasharray="5 4"/><text x="526" y="544" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Firm data · the agent only reads it</text><rect x="28" y="520" width="460" height="130" rx="8" fill="none" stroke="#4a4a4a" stroke-width="1" stroke-dasharray="5 4"/><text x="42" y="544" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Evaluation · offline in CI, live by hand</text><rect x="48" y="190" width="380" height="76" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="238" y="214" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Web app<tspan fill="#a3a3a3" font-weight="400"> (Entra sign-in to build)</tspan></text><text x="62" y="234" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">React and TypeScript: intake, approvals, audit</text><text x="62" y="251" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">acts as a made-up person on localhost</text><rect x="612" y="170" width="360" height="80" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="792" y="194" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Model provider</text><text x="626" y="214" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">outside your machine: Anthropic by default</text><text x="626" y="231" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">sees the rules, the fenced email, results</text><rect x="48" y="360" width="208" height="108" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="152" y="384" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">API</text><text x="62" y="404" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">FastAPI, /api/v1</text><text x="62" y="421" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">Entra ID or dev roles</text><text x="62" y="438" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">limits, hosts, headers</text><rect x="280" y="360" width="208" height="108" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="384" y="384" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Agent loop</text><text x="294" y="404" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">steps, calls, $ capped</text><text x="294" y="421" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">requester role only</text><text x="294" y="438" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">stand-in when offline</text><rect x="512" y="360" width="208" height="108" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="616" y="384" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Toolbox</text><text x="526" y="404" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">five tools, args checked</text><text x="526" y="421" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">drafts need searches</text><text x="526" y="438" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">findings from searches</text><rect x="744" y="360" width="208" height="108" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="848" y="384" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Drafts and gate</text><text x="758" y="404" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">approval: four eyes</text><text x="758" y="421" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">open: approval needed</text><text x="758" y="438" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">checked again in SQL</text><rect x="532" y="560" width="208" height="74" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="636" y="584" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Firm records</text><text x="546" y="604" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">about 500 made-up names</text><text x="546" y="621" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">near duplicates planted</text><rect x="752" y="560" width="200" height="74" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="852" y="584" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Drafts and audit</text><text x="766" y="604" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">SQLite, append-only</text><text x="766" y="621" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">every run and call</text><rect x="48" y="560" width="208" height="74" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="152" y="584" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">20 scenarios</text><text x="62" y="604" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">planted conflicts</text><text x="62" y="621" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">a timeout, injections</text><rect x="268" y="560" width="200" height="74" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="368" y="584" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Scorers</text><text x="282" y="604" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">recall, escalation</text><text x="282" y="621" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">gate, time and cost</text><path d="M256 414 L280 414" fill="none" stroke="#a3a3a3" stroke-width="1.2" marker-end="url(#plain)"/><path d="M488 414 L512 414" fill="none" stroke="#a3a3a3" stroke-width="1.2" marker-end="url(#plain)"/><path d="M720 414 L744 414" fill="none" stroke="#a3a3a3" stroke-width="1.2" marker-end="url(#plain)"/><path d="M238 266 L238 316" fill="none" stroke="#a3a3a3" stroke-width="1.2" marker-end="url(#plain)"/><text x="246" y="296" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5" font-weight="400">emails, drafts, decisions</text><path d="M440 358 L440 302 L792 302 L792 252" fill="none" stroke="#5b8def" stroke-width="2" marker-end="url(#accent)"/><text x="600" y="294" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="12.5" font-weight="700">prompt out, tool calls back</text><path d="M616 468 L616 516" fill="none" stroke="#a3a3a3" stroke-width="1.2" marker-end="url(#plain)"/><text x="626" y="500" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5" font-weight="400">reads</text><path d="M848 468 L848 516" fill="none" stroke="#a3a3a3" stroke-width="1.2" marker-end="url(#plain)"/><text x="858" y="500" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5" font-weight="400">writes</text><path d="M384 518 L384 490" fill="none" stroke="#a3a3a3" stroke-width="1.2" marker-end="url(#plain)"/><text x="392" y="508" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5" font-weight="400">runs every scenario</text><rect x="28" y="680" width="944" height="92" rx="8" fill="#202020" stroke="#3d3d3d" stroke-width="1"/><text x="42" y="706" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Foundation</text><text x="42" y="728" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">config/config.toml holds every setting, config/.env holds secrets only · kds args, settings, logs, llm, evals, synthetic</text><text x="42" y="745" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">JSON logs with request ids, never email text · CI: tests, offline eval, CodeQL, gitleaks, audits</text></svg>
