########################################################################
#                                                                      #
#                          config/config.toml                          #
#                                                                      #
########################################################################
# Author:            Kevin Street
# Created on:        2026-10-29
# Last modified on:  2026-11-07
#
# Holds every setting the service, the evaluation and the dashboard
# read, and every value two files share, at its default. No secrets:
# those go in config/.env.
#
# Each key's name is its section and key joined: [match] likely is
# match_likely, and the environment variable MATCH_LIKELY overrides it.
# A nested table is one setting: [labels.categories] is
# labels_categories. backend/tests/test_config.py keeps this file equal
# to the defaults in backend/src/intake_agent/config.py and the shared
# kds settings. The web app reads the keys it needs from this file when
# it is built.

[llm]
provider = "fake"                         # anthropic | openai | azure | fake (offline stand-in)
model = "claude-sonnet-5-5"               # the model that plays the agent
judge_model = "claude-sonnet-5-5"         # unused here: runs are scored by fixed checks
embedding_model = "text-embedding-3-small"  # unused here: names are matched without embeddings
max_tokens = 2048                         # unused here: [agent] max_tokens limits each call
temperature = 0.0                         # 0 keeps runs repeatable
max_retries = 3                           # retries for model failures that can succeed later
timeout_s = 60.0                          # how long one model call may take

[azure_openai]
api_version = "2024-10-21"

[eval]
budget_usd = 5.0                          # one process stops calling the model past this spend
offline_provider = "fake"                 # the provider of the offline stand-in; its runs are the baseline

[log]
dir = "logs"                              # one YYYY-MM-DD.jsonl file per day
level = "INFO"                            # DEBUG | INFO | WARNING | ERROR
redact = true                             # remove emails, phone numbers and IDs from logs
trace = false                             # print logger lines as HH:MM:SS traces

# Spans: the timed steps of each intake run, for Langfuse or any tracing
# tool (shared kds settings, but service)
[spans]
keep = false                              # write each evaluation's spans beside its results
content = false                           # put intake emails, prompts and tool text on spans
public = false                            # let anyone with a trace's link open it in Langfuse
service = "intake-conflicts-agent"        # the name spans are recorded under

# The MCP server, over stdio: its client plays the agent, as a requester
[mcp]
name = "intake-conflicts-agent"          # the name the server gives clients
requester_id = "mcp-client"              # the id an MCP client acts under, as a requester only
requester_name = "MCP client"            # the name an approver sees on its drafts
model = "mcp-client"                     # recorded on an MCP run in place of a model
max_open_runs = 3                        # intakes one MCP client may have open at once

# Where spans go once the two Langfuse keys are in config/.env
[langfuse]
base_url = "https://cloud.langfuse.com"   # https://us.cloud.langfuse.com for US data

[data]
firm = "data/samples/firm.json"           # the planted records the database is built around
database = "data/generated/firm.sqlite"   # the made-up firm database, built when missing
scenarios = "data/evals/scenarios.jsonl"  # the twenty evaluation scenarios
results = "data/evals/results"            # where evaluation results are written
export = "data/export"                    # the CSV files for Tableau
figures = "figures.json"                  # the case study's figures, in the results folder

# How files are read and written.
[files]
encoding = "utf-8"                        # every file is read and written as UTF-8

[seed]
random = 11                               # the same seed always builds the same database
clients = 300                             # clients, planted ones included
matters = 180                             # existing matters
adverse_parties = 200                     # parties the firm has been against
near_duplicate_share = 0.2                # made-up adverse parties that are a client, mistyped
former_share = 0.25                       # made-up clients the firm no longer acts for
closed_share = 0.35                       # made-up matters that are closed

[match]
likely = 92                               # from this score two names are likely one party
possible = 80                             # from this score a person must decide
limit = 5                                 # the most matches one search returns
strong_bands = ["exact", "likely"]        # the bands that count as the same party

[agent]
max_steps = 10                            # the most model calls one run may make
max_tool_calls = 30                       # the most tool calls one run may make
max_tokens = 1500                         # the most tokens one model call may write
run_budget_usd = 0.5                      # one run stops calling the model past this spend
min_email_chars = 20                      # the shortest intake email accepted
max_email_chars = 20000                   # the longest intake email accepted
max_parties = 10                          # the most adverse parties one draft may name

[store]
timeout_s = 2.0                           # how long a query waits on a locked database
retries = 2                               # how many times a search retries a timed-out read
backoff_s = 0.2                           # the first wait between retries; it doubles

[api]
host = "127.0.0.1"                        # listen on this machine only
port = 8000
prefix = "/api/v1"                        # the path every route lives under; the web app calls it
request_id_header = "X-Request-ID"        # the header that carries a request's id, both ways
intakes_per_minute = 6                    # per person; each intake calls the model
allowed_origins = ["http://localhost:5173"]  # browser origins allowed to call the API
allowed_hosts = ["localhost", "127.0.0.1"]   # host names requests may be addressed to
min_reason_chars = 10                     # the shortest reason for approving past a flag
max_note_chars = 500                      # the longest decision note
list_limit = 50                           # drafts or runs a list returns when none is asked for
max_list_limit = 200                      # the most drafts or runs a list may be asked for

# The values below are fixed: the service, its API and the web app share them as they are,
# and the settings refuse any other value.
[ids]
draft_pattern = "^D-[0-9a-f]{10}$"        # a draft id: D- and ten hex digits; others are refused
run_pattern = "^R-[0-9a-f]{10}$"          # a run id: R- and ten hex digits; others are refused

[roles]
requester = "requester"                   # the role that runs intakes
approver = "approver"                     # the role that decides drafts and opens matters

[verdicts]
clear = "clear"                           # no record touches the new matter
review = "review"                         # a person must decide
conflict = "conflict"                     # the firm cannot take the matter as it stands

[units]
ms_per_second = 1000                      # for timings in the logs and on screen
percent = 100                             # a share of one, written in percent

[auth]
mode = "dev"                              # dev: trusted headers, this machine only | entra

[entra]
tenant_id = ""                            # the directory (tenant) id, a GUID
audience = ""                             # the API's application (client) id
requester_role = "Intake.Requester"       # the app role that may run intakes
approver_role = "Intake.Approver"         # the app role that may approve and open matters
leeway_s = 60                             # clock skew allowed on token times
keys_cache_s = 3600                       # how long the tenant's signing keys are cached

[ui]
examples = ["s04", "s09", "s13", "s18"]   # scenario ids the web app offers to try

# The evaluation dashboard, which has no sign-in and so listens on this machine only.
[dashboard]
host = "127.0.0.1"                        # this machine only
port = 8050

# The ids of the dashboard's parts, which its layout and its callback share.
[dashboard_ids]
url = "url"                               # the location, whose first change reads the scheme
scheme = "scheme"                         # the store that holds the browser's colour scheme
runs = "runs"                             # the run picker
legend = "legend"                         # the runs' key
tiles = "tiles"                           # the headline numbers
verdicts = "verdicts"                     # the chart of scenarios that ended as expected
steps = "steps"                           # the chart of model calls and tool calls per scenario
latency = "latency"                       # the time chart
cost = "cost"                             # the cost chart
wrong_table = "wrong-table"               # the table of scenarios that did not end as expected

# The column names of the evaluation tables the dashboard draws and the
# Tableau CSV files hold.
[columns]
run_id = "run_id"                         # the run's id: its file name without .json
run = "run"                               # the run's long label
model = "model"                           # the model that played the agent
started_at = "started_at"                 # when the run started, UTC
scenario_id = "scenario_id"               # the scenario's id, s01 to s20
title = "title"                           # the scenario's title
category = "category"                     # the kind of scenario: conflict, ambiguous, clean or failure
as_expected = "as_expected"               # 1 when the ending and the verdict shown match the scenario's
seconds = "seconds"                       # a scenario's time, in seconds
steps = "steps"                           # a scenario's model calls
tool_calls = "tool_calls"                 # a scenario's tool calls
cost_per_scenario = "mean_cost_usd"       # a run's mean cost per scenario, as the summary names it
prices_as_of = "prices_as_of"             # the date of the list prices a run's costs use

# The dashboard's charts, which the case study's figures share.
[charts]
light_scheme = "light"                    # the light scheme, which the exported figures use
dark_scheme = "dark"                      # the dark scheme
max_runs = 3                              # the most runs a chart compares: one per ramp step
font_size = 12                            # the size of chart text, in pixels
tick_size = 11                            # the size of value-axis ticks and small notes, in pixels
edge = 8                                  # the margin every chart keeps at its edges, in pixels
clear = "rgba(0,0,0,0)"                   # the colour that lets the card show through
align = "left"                            # titles and notes line up on their left edge
cost_places = 4                           # the decimals a cost is written with
verdicts_title = "Scenarios that ended as expected, by kind"
steps_title = "Model calls and tool calls per scenario"
latency_title = "Seconds per scenario"
cost_title = "Cost per scenario, at list prices"

# The words people read, shared by the dashboard and the CSV files.
[labels.categories]                       # each kind of scenario, in the order the results report them
conflict = "Conflict"
ambiguous = "Ambiguous"
clean = "Clean"
failure = "Failure"
