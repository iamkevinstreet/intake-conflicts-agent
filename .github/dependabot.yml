########################################################################
#                        .github/dependabot.yml                        #
########################################################################
#  Author:            Kevin Street                                     #
#  Created on:        2026-10-29                                       #
#  Last modified on:  2026-10-29                                       #
#  Purpose:           Weekly pull requests that update the pinned      #
#                     Actions, the uv lockfile and the npm lockfile.   #
########################################################################
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint supports TypeScript below 6.1, and its strict rules are required;
      # raise this when a typescript-eslint release supports a newer TypeScript.
      - dependency-name: typescript
        versions: [">=6.1"]
