########################################################################
#                                                                      #
#                   .github/workflows/eval-live.yml                    #
#                                                                      #
########################################################################
# Author:            Kevin Street
# Created on:        2026-10-29
# Last modified on:  2026-11-03
#
# Runs the twenty scenarios with a real model as the agent when started
# by hand, then its figures, CSV files and index, and commits them to a
# branch.

name: eval-live

# The model plays the agent on all twenty scenarios, using the ANTHROPIC_API_KEY repository secret,
# which never appears in logs (kds.logs redacts, and the adapter stops at the budget), then the
# figures, the Tableau CSV files and the index the case study reads are built from the results.
# Results are committed to the eval-results branch and uploaded as an artifact; merging that branch
# into main publishes them.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model id (priced in kds.llm's pricing table)
        type: string
        default: claude-sonnet-5-5
      budget_usd:
        description: Stop calling the model once this much has been spent
        type: string
        default: "5"

permissions:
  contents: write

concurrency:
  group: eval-live
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_PROVIDER: anthropic
      LLM_MODEL: ${{ inputs.model }}
      EVAL_BUDGET_USD: ${{ inputs.budget_usd }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LOG_REDACT: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"

      - name: Install the locked backend with the dashboard (hashes checked)
        run: uv sync --project backend --locked --all-extras

      - name: Check the key is present
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not set as a repository secret"; exit 1; fi

      - name: The twenty scenarios with the model as the agent
        run: uv run --project backend --no-sync python -m intake_agent.evals.run --name live

      - name: Figures, CSV files and index for the case study
        run: make publish

      - name: Job summary
        run: cat data/evals/results/live-latest.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-results
          path: |
            data/evals/results/
            data/export/

      - name: Commit results to the eval-results branch
        run: |
          git config user.name "Kevin Street"
          git config user.email "747156+iamkevinstreet@users.noreply.github.com"
          for folder in evals/results export; do
            mkdir -p "${RUNNER_TEMP}/data/${folder}"
            cp -r "data/${folder}/." "${RUNNER_TEMP}/data/${folder}/"
          done
          git stash --include-untracked --quiet
          git fetch origin eval-results:eval-results 2>/dev/null || true
          if git show-ref --verify --quiet refs/heads/eval-results; then
            git checkout eval-results
          else
            git checkout -b eval-results
          fi
          for folder in evals/results export; do
            mkdir -p "data/${folder}"
            cp -r "${RUNNER_TEMP}/data/${folder}/." "data/${folder}/"
          done
          git add data/evals/results data/export
          git commit -m "Evaluation: ${LLM_MODEL}" || echo "nothing to commit"
          git push origin eval-results
